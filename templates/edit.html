<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Редактор кампаний</title>
<style>
body{font-family:sans-serif;background:#f4f6f8;padding:20px}
.container{max-width:800px;margin:0 auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
input,button{padding:10px;margin:5px 0;border-radius:4px;border:1px solid #ccc}
button{background:#007bff;color:#fff;border:none;cursor:pointer}
.stream-box{margin-top:15px;padding:12px;border:1px solid #e0e0e0;border-radius:6px}
.offer-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #eee}
.remove-btn{background:#dc3545;padding:4px 10px}.add-btn{background:#28a745}
.alert{padding:10px;margin:10px 0;border-radius:4px}
.error{background:#f8d7da;color:#721c24}.success{background:#d4edda;color:#155724}
</style>
</head>
<body>
<div class="container">
<h2>Редактор кампаний</h2>
<div>
<input type="number" id="campaignIdInput" placeholder="ID кампании" style="width:200px;">
<button onclick="loadCampaign()">Загрузить</button>
<a href="/">Назад к созданию</a>
</div>
<div id="message" class="alert" style="display:none;"></div>
<div id="streams-section"></div>
<div style="margin-top:20px;">
<input type="number" id="newOfferId" placeholder="ID нового оффера">
<button class="add-btn" onclick="addOffer()">Добавить в выбранный поток</button>
</div>
</div>
<script>
let streams = new Array();
let selectedStreamId = null;
let campaignId = null;

function showMsg(t, c) {
  const m = document.getElementById('message');
  m.className = 'alert ' + c; m.textContent = t; m.style.display = 'block';
}

async function loadCampaign() {
  campaignId = document.getElementById('campaignIdInput').value;
  if (!campaignId) return alert('Введите ID кампании');
  const res = await fetch('/api/campaigns/' + campaignId + '/streams');
  const data = await res.json();
  if (data.status === 'error') return showMsg('ОШИБКА: ' + data.message, 'error');
  streams = data.streams || new Array();
  selectedStreamId = null;
  renderStreams();
  if (streams.length === 0) showMsg('В кампании нет потоков', 'error');
  else document.getElementById('message').style.display = 'none';
}

function renderStreams() {
  const sec = document.getElementById('streams-section');
  sec.innerHTML = '';
  streams.forEach(s => {
    const offerList = s.offers || new Array();
    const ids = offerList.map(o => o.offer_id);
    let rows = '';
    if (ids.length === 0) {
      rows = '<i>Нет офферов в этом потоке</i>';
    } else {
      ids.forEach(oid => {
        rows += '<div class="offer-row"><span>Offer ID: ' + oid + '</span>' +
                '<button class="remove-btn" onclick="removeOffer(' + oid + ')">Удалить</button></div>';
      });
    }
    const b = document.createElement('div');
    b.className = 'stream-box';
    b.innerHTML = '<label><input type="radio" name="streamSel" onclick="selectStream(' + s.id + ')"> <b>' + s.name +
      '</b> (ID: ' + s.id + ', schema: ' + s.schema + ')</label><div>' + rows + '</div>';
    sec.appendChild(b);
  });
}

function selectStream(id) { selectedStreamId = id; }

function currentOfferIds() {
  const s = streams.find(x => x.id === selectedStreamId);
  if (!s) return new Array();
  return (s.offers || new Array()).map(o => o.offer_id);
}

async function saveOffers() {
  const res = await fetch('/api/campaigns/' + campaignId + '/update-offers', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ stream_id: selectedStreamId, offer_ids: currentOfferIds() })
  });
  const data = await res.json();
  if (data.status === 'ok') { showMsg('Сохранено', 'success'); loadCampaign(); }
  else showMsg('ОШИБКА: ' + data.message, 'error');
}

function addOffer() {
  if (!selectedStreamId) return alert('Сначала выбери поток');
  const s = streams.find(x => x.id === selectedStreamId);
  if (s.schema !== 'landings') return alert('Только в поток со схемой landings');
  const nid = parseInt(document.getElementById('newOfferId').value);
  if (!nid) return alert('Введите ID оффера');
  if (!s.offers) s.offers = new Array();
  if (s.offers.some(o => o.offer_id === nid)) return alert('Уже есть');
  s.offers.push({ offer_id: nid, share: 100 });
  document.getElementById('newOfferId').value = '';
  saveOffers();
}

async function removeOffer(oid) {
  if (!selectedStreamId) return alert('Сначала выбери поток');
  const s = streams.find(x => x.id === selectedStreamId);
  if (!s || !s.offers) return;
  s.offers = s.offers.filter(o => o.offer_id !== oid);
  saveOffers();
}
</script>
</body>
</html>
